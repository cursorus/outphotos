name: Telegram media -> records.json + Pages

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: tg-media-processing
  cancel-in-progress: true

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 2. Install system deps
      - name: Install system deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      # 3. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 4. Install Python deps
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install requests exifread

      # 5. Run Telegram processor
      - name: Run processor
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SRC_CHAT_ID: ${{ secrets.SRC_CHAT_ID }}
        run: python bot_auto_run.py

      # 6. Commit changes if records/state updated
      - name: Commit records/state if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git status --porcelain | grep -E "records.json|state.json"; then
            git add records.json state.json
            git commit -m "Update records/state (automated)"
            git push https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY} HEAD:main
          else
            echo "No changes to commit"

      # 7. Build HTML with secret
      - name: Build HTML with token
        run: |
          sed "s/{{BOT_TOKEN}}/${{ secrets.BOT_TOKEN }}/g" index.template.html > index.html

      # 8. Deploy to GitHub Pages
      - name: Deploy to Pages
        uses: peaceiris/actions-gh-pages@v3.12
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .
          force_orphan: true
