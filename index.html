<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TG Gallery</title>
<style>
body{font-family:Arial;padding:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.item img,.item video{width:100%;height:120px;object-fit:cover;border-radius:6px}
.meta{font-size:12px;color:#333;margin-top:4px}
</style>
</head>
<body>
<h2>Gallery</h2>
<div id="sorted" class="grid"></div>
<h3>Unsorted</h3>
<div id="unsorted" class="grid"></div>

<script>
async function load(){
  const r = await fetch('records.json?'+Date.now());
  const arr = await r.json();
  const sorted = arr.filter(x=>x.created_at).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  const unsorted = arr.filter(x=>!x.created_at);
  const s = document.getElementById('sorted'), u = document.getElementById('unsorted');
  s.innerHTML=''; u.innerHTML='';
  function make(it){
    const div=document.createElement('div'); div.className='item';
    const src = `tg://file?file_id=${it.src_file_id}`;
    if(it.type==='photo'){
      const img=document.createElement('img'); img.src = src; div.appendChild(img);
    } else {
      const v=document.createElement('video'); v.src=src; v.muted=true; v.playsInline=true; v.controls=false; div.appendChild(v);
    }
    const meta=document.createElement('div'); meta.className='meta'; meta.textContent = it.created_at || 'no date';
    div.appendChild(meta);
    return div;
  }
  sorted.forEach(it=>s.appendChild(make(it)));
  unsorted.forEach(it=>u.appendChild(make(it)));
}
load();
</script>
</body>
</html>
