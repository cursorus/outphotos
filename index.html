<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Gallery</title>
<style>
:root{
  --bg:#1c1c1c;
  --panel:#0f1720;
  --accent:#60a5fa;
  --muted:#9aa4b2;
}
body{
  margin:0;
  background:var(--bg);
  color:#fff;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  -webkit-tap-highlight-color:transparent;
}
header{
  display:flex;
  justify-content:flex-start;
  gap:18px;
  padding:10px;
  font-size:17px;
}
header div{ cursor:pointer; user-select:none; padding:6px 8px; border-radius:8px; }
header div.active{ background:#111; }

#gallery{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px;
  padding:6px;
}

.year{
  grid-column:1/-1;
  text-align:left;
  padding:6px 4px;
  font-size:18px;
  font-weight:700;
  color:#fff;
}

.item{
  border:2px solid rgba(255,255,255,0.06);
  height:120px;
  border-radius:8px;
  cursor:pointer;
  background:#131313;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}
.item .placeholder{
  width:40%;
  height:40%;
  opacity:0.12;
}

.item img, .item video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/* Fullscreen viewer */
#fs{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.96);
  z-index:1200;
  justify-content:center;
  align-items:flex-start;
  flex-direction:column;
  padding-top:28px;
  box-sizing:border-box;
}
#fs .media-wrap{
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
}
#fs img, #fs video{
  width: calc(100vw - 24px);
  height: auto;
  max-height: calc(100vh - 160px);
  border-radius:8px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
}

#fsPanel{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  display:flex;
  justify-content:center;
  padding:18px;
  box-sizing:border-box;
  transform: translateY(110%);
  transition: transform 320ms cubic-bezier(.2,.9,.3,1);
  z-index:1250;
}
#fs.showPanel #fsPanel{ transform: translateY(0); }

.panelBtn{
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:10px 14px;
  background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
  color:#fff;
  border:none;
  border-radius:12px;
  font-weight:600;
  cursor:pointer;
  margin:0 8px;
  min-width:140px;
  justify-content:center;
}
.panelBtn svg{ width:18px; height:18px; flex:0 0 18px; }

#runWrap{ display:flex; justify-content:center; padding:12px; }
#runBtn{
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:10px 16px;
  border-radius:12px;
  border:none;
  background:var(--accent);
  color:#07243b;
  font-weight:700;
  cursor:pointer;
}
#runIcon{ width:18px; height:18px; display:inline-block; }

@keyframes spin { to { transform: rotate(360deg); } }
.icon-spinner{ animation: spin 1s linear infinite; }

.hidden{ display:none !important; }
.center{ display:flex; align-items:center; justify-content:center; }
</style>
</head>
<body>

<header>
  <div id="btnSorted" class="active">Сортированное</div>
  <div id="btnUnsorted">Несортированное</div>
</header>

<div id="gallery"></div>

<div id="fs" onclick="fsClose(event)">
  <div class="media-wrap" id="fsMediaWrap"></div>
  <div id="fsDate" style="color:#ddd; text-align:center; margin-top:12px;"></div>
  <div id="fsPanel">
    <button class="panelBtn" id="downloadBtn" title="Скачать">Скачать</button>
    <button class="panelBtn" id="deleteBtn" title="Удалить из галереи">Удалить</button>
  </div>
</div>

<div id="runWrap">
  <button id="runBtn" title="Запустить workflow">
    <span id="runIcon">▶</span>
    <span id="runText">Запустить workflow</span>
  </button>
</div>

<script>
let data = [];
let sorted = true;
const deletedIdsKey = "outphotos_deleted_ids";
let deletedIds = new Set(JSON.parse(localStorage.getItem(deletedIdsKey) || "[]"));

// Загрузка records.json
async function loadRecords(){
  try{
    const r = await fetch("/records.json");
    if(!r.ok) return;
    data = await r.json();
    render();
  }catch(e){ console.error(e); }
}

// Получение прямого URL к файлу через backend endpoint
async function getFileUrl(file_id){
  try{
    const res = await fetch(`/api/get-file?file_id=${encodeURIComponent(file_id)}`);
    if(!res.ok) return null;
    const j = await res.json();
    return j.url;  // backend возвращает { url: "..." }
  }catch(e){ return null; }
}

async function render(){
  const g = document.getElementById("gallery");
  g.innerHTML = "";
  const arr = sorted ? data.filter(x=>x.created_at) : data.filter(x=>!x.created_at);
  let currentYear = "";
  for(const item of arr){
    if(deletedIds.has(item.src_msg_id)) continue;
    const year = item.created_at ? new Date(item.created_at).getFullYear() : "???";
    if(year !== currentYear){
      currentYear = year;
      const y = document.createElement("div");
      y.className = "year";
      y.textContent = year;
      g.appendChild(y);
    }

    const div = document.createElement("div");
    div.className = "item";
    const placeholder = document.createElement("div");
    placeholder.className = "placeholder";
    placeholder.innerHTML = "⏳"; // простой placeholder
    div.appendChild(placeholder);
    g.appendChild(div);

    (async ()=>{
      const url = await getFileUrl(item.src_file_id);
      if(!url){ div.remove(); return; }
      div.innerHTML = "";
      if(item.type==="photo"){
        const img = document.createElement("img");
        img.src = url;
        div.appendChild(img);
      } else if(item.type==="video"){
        const v = document.createElement("video");
        v.src = url;
        v.controls = true;
        div.appendChild(v);
      } else {
        div.innerHTML = "<div style='padding:8px;color:#aaa'>Unsupported</div>";
      }
      div.onclick = ()=>openFS(item);
    })();
  }
}

async function openFS(item){
  const fs = document.getElementById("fs");
  const wrap = document.getElementById("fsMediaWrap");
  const dateEl = document.getElementById("fsDate");
  wrap.innerHTML = "";
  dateEl.textContent = item.created_at ? new Date(item.created_at).toLocaleString() : "";
  fs.style.display = "flex";

  const url = await getFileUrl(item.src_file_id);
  if(!url){ closeViewerImmediate(); return; }

  if(item.type==="photo"){
    const img = document.createElement("img");
    img.src = url;
    wrap.appendChild(img);
    setupDownloadButton(url,item);
    setupDeleteButton(item);
  } else if(item.type==="video"){
    const v = document.createElement("video");
    v.src = url;
    v.controls = true;
    v.autoplay = true;
    wrap.appendChild(v);
    setupDownloadButton(url,item);
    setupDeleteButton(item);
  }
}

function closeViewerImmediate(){
  const fs = document.getElementById("fs");
  fs.style.display = "none";
  document.getElementById("fsMediaWrap").innerHTML="";
}

function fsClose(e){
  const panel = document.getElementById("fsPanel");
  const wrap = document.getElementById("fsMediaWrap");
  if(panel.contains(e.target) || wrap.contains(e.target)) return;
  closeViewerImmediate();
}

function setupDownloadButton(url,item){
  const btn = document.getElementById("downloadBtn");
  btn.onclick = e=>{
    e.stopPropagation();
    const a = document.createElement("a");
    a.href = url;
    a.download = `outphoto_${item.src_msg_id}${item.type==="photo"?".jpg":".mp4"}`;
    document.body.appendChild(a);
    a.click();
    a.remove();
  };
}

function setupDeleteButton(item){
  const btn = document.getElementById("deleteBtn");
  btn.onclick = e=>{
    e.stopPropagation();
    deletedIds.add(item.src_msg_id);
    localStorage.setItem(deletedIdsKey, JSON.stringify([...deletedIds]));
    render();
    closeViewerImmediate();
  };
}

document.getElementById("btnSorted").onclick=()=>{
  sorted=true;
  document.getElementById("btnSorted").classList.add("active");
  document.getElementById("btnUnsorted").classList.remove("active");
  render();
};
document.getElementById("btnUnsorted").onclick=()=>{
  sorted=false;
  document.getElementById("btnUnsorted").classList.add("active");
  document.getElementById("btnSorted").classList.remove("active");
  render();
};

// workflow trigger stub
document.getElementById("runBtn").onclick=()=>{
  alert("Запуск workflow через backend (не реализован в фронтенде)");
};

// initial load
loadRecords();
</script>
</body>
</html>
