<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Галерея</title>
<style>
    body {
        font-family: sans-serif;
        margin: 0;
        background: #111;
        color: #fff;
    }

    /* Панель альбомов */
    #albumsBar {
        display: flex;
        align-items: center;
        background: #1a1a1a;
        padding: 10px;
        border-bottom: 1px solid #333;
        gap: 10px;
        position: sticky;
        top: 0;
        z-index: 50;
    }

    #albumsBar button {
        background: #2c2c2c;
        border: 1px solid #444;
        color: #fff;
        padding: 6px 12px;
        border-radius: 6px;
        cursor: pointer;
    }

    #albumsBar button.active {
        background: #4a4a4a;
    }

    /* Галочка выбора */
    #selectModeBtn {
        font-size: 20px;
        padding: 4px 10px;
    }

    /* Галерея */
    #gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 12px;
        padding: 12px;
    }

    .item {
        background: #222;
        padding: 6px;
        border-radius: 8px;
        position: relative;
    }

    .item img, .item video {
        width: 100%;
        border-radius: 6px;
        background: #333;
    }

    /* Чекбокс выбора медиа */
    .selectBox {
        position: absolute;
        top: 6px;
        left: 6px;
        width: 22px;
        height: 22px;
        background: rgba(255,255,255,0.8);
        border-radius: 4px;
        display: none;
        align-items: center;
        justify-content: center;
        color: #000;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    .selected .selectBox {
        background: #4caf50 !important;
        color: #fff !important;
    }

    /* Панель назначения альбома */
    #assignPanel {
        display: none;
        padding: 10px;
        background: #1a1a1a;
        border-top: 1px solid #333;
        position: sticky;
        bottom: 0;
        z-index: 50;
    }

    /* Консоль */
    #consolePanel {
        background: #000;
        color: #0f0;
        font-family: monospace;
        padding: 10px;
        height: 200px;
        overflow-y: auto;
        display: none;
        border-top: 3px solid #444;
    }

    #toggleConsole {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: #222;
        border: 1px solid #555;
        color: #fff;
        padding: 10px 14px;
        border-radius: 50%;
        font-size: 20px;
        cursor: pointer;
        z-index: 100;
    }
</style>
</head>
<body>

<!-- Панель альбомов -->
<div id="albumsBar">
    <button id="selectModeBtn">☑</button>
    <button class="albumBtn active" data-album="all">Все</button>
    <div id="albumsContainer"></div>
</div>

<!-- Галерея -->
<div id="gallery"></div>

<!-- Панель выбора альбома для добавления -->
<div id="assignPanel">
    <span>Добавить выбранные элементы в альбом:</span>
    <select id="assignSelect"></select>
</div>

<!-- Консоль -->
<div id="consolePanel"></div>

<button id="toggleConsole">🖥</button>

<script>
function log(msg) {
    const p = document.createElement("div");
    p.textContent = "[LOG] " + msg;
    document.getElementById("consolePanel").appendChild(p);
}
log("Панель консоли загружена");

let records = [];
let albums = [];
let selectMode = false;
let selected = new Set();

async function loadRecords() {
    log("Загрузка records.json...");
    const res = await fetch("records.json");
    log("Статус ответа: " + res.status);
    records = await res.json();
    log("Загружено записей: " + records.length);

    collectAlbums();
    renderAlbumButtons();
    updateAssignList();
    renderGallery();
}

function collectAlbums() {
    const set = new Set();
    records.forEach(r => {
        if (r.album) set.add(r.album);
    });
    albums = Array.from(set).sort();
}

function renderAlbumButtons() {
    const container = document.getElementById("albumsContainer");
    container.innerHTML = "";
    albums.forEach(a => {
        const b = document.createElement("button");
        b.className = "albumBtn";
        b.dataset.album = a;
        b.textContent = a;
        container.appendChild(b);
    });
}

function updateAssignList() {
    const sel = document.getElementById("assignSelect");
    sel.innerHTML = "";
    albums.forEach(a => {
        const opt = document.createElement("option");
        opt.value = a;
        opt.textContent = a;
        sel.appendChild(opt);
    });
}

function renderGallery(currentAlbum = "all") {
    log("Рендер галереи…");

    const g = document.getElementById("gallery");
    g.innerHTML = "";

    let list = records;
    if (currentAlbum !== "all") {
        list = records.filter(r => r.album === currentAlbum);
    }

    log("Элементов в списке: " + list.length);

    list.forEach(item => {
        const div = document.createElement("div");
        div.className = "item";
        div.dataset.id = item.src_msg_id;

        const sbox = document.createElement("div");
        sbox.className = "selectBox";
        sbox.textContent = "✓";
        div.appendChild(sbox);

        let url = item.file_path || item.local_path || item.download_url || item.src_file_id;

        if (item.type === "photo") {
            const img = document.createElement("img");
            img.src = url;
            img.loading = "lazy";
            div.appendChild(img);
        } else if (item.type === "video") {
            const video = document.createElement("video");
            video.src = url;
            video.controls = true;
            div.appendChild(video);
        }

        div.addEventListener("click", () => {
            if (!selectMode) return;

            if (selected.has(item.src_msg_id)) {
                selected.delete(item.src_msg_id);
                div.classList.remove("selected");
            } else {
                selected.add(item.src_msg_id);
                div.classList.add("selected");
            }
        });

        g.appendChild(div);
    });
}

/* Выбор альбома */
document.addEventListener("click", e => {
    if (e.target.classList.contains("albumBtn")) {
        document.querySelectorAll(".albumBtn").forEach(b => b.classList.remove("active"));
        e.target.classList.add("active");
        const album = e.target.dataset.album;
        renderGallery(album);
    }
});

/* Включение режима выбора */
document.getElementById("selectModeBtn").addEventListener("click", () => {
    selectMode = !selectMode;
    selected.clear();

    if (selectMode) {
        document.querySelectorAll(".selectBox").forEach(b => b.style.display = "flex");
        document.getElementById("assignPanel").style.display = "block";
        document.getElementById("selectModeBtn").style.background = "#4a4a4a";
    } else {
        document.querySelectorAll(".selectBox").forEach(b => b.style.display = "none");
        document.getElementById("assignPanel").style.display = "none";
        document.querySelectorAll(".item").forEach(i => i.classList.remove("selected"));
        document.getElementById("selectModeBtn").style.background = "";
    }
});

/* Назначение альбома */
document.getElementById("assignSelect").addEventListener("change", () => {
    const album = document.getElementById("assignSelect").value;

    let patch = [];

    selected.forEach(id => {
        const r = records.find(x => x.src_msg_id == id);
        if (r) {
            patch.push({ id: r.src_msg_id, newAlbum: album });
        }
    });

    log("PATCH для обновления records.json:");
    log(JSON.stringify(patch, null, 2));
});

/* Консоль */
document.getElementById("toggleConsole").addEventListener("click", () => {
    const p = document.getElementById("consolePanel");
    p.style.display = (p.style.display === "block") ? "none" : "block";
});

loadRecords();
</script>

</body>
</html>
