<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Gallery</title>
<style>
  body{
    margin:0;
    background:#0f1720;
    color:white;
    font-family:sans-serif;
  }

  header{
    text-align:center;
    padding:10px 0;
    font-size:18px;
    display:flex;
    justify-content:center;
    gap:25px;
  }
  header div{ cursor:pointer; }

  #gallery{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    padding:6px;
  }

  .year{
    grid-column:1 / -1;
    text-align:left;
    padding:5px;
    font-size:16px;
    font-weight:bold;
  }

  .item{
    border:2px solid #ffffff33; /* ТВОЯ РАМКА */
    height:120px;
    overflow:hidden;
    border-radius:6px;
    cursor:pointer;
    background:#1a2530;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .item img,
  .item video{
    width:100%;
    height:100%;
    object-fit:cover;
  }

  /* Fullscreen */
  #fs{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.95);
    z-index:2000;
    justify-content:center;
    align-items:center;
    flex-direction:column;
  }
  #fs img, #fs video{
    max-width:100%;
    max-height:80%;
  }
  #fs .date{
    margin-top:12px;
    font-size:18px;
  }
</style>
</head>
<body>

<header>
  <div id="btnSorted">Сортированное</div>
  <div id="btnUnsorted">Несортированное</div>
</header>

<div id="gallery"></div>

<div id="fs">
  <div id="fsContent"></div>
  <div class="date" id="fsDate"></div>
</div>

<script>
let data = [];
let sorted = true;

// Загружаем JSON
fetch("records.json").then(r=>r.json()).then(j=>{
  data = j;
  render();
});

// Рендер галереи
function render(){
  const g = document.getElementById("gallery");
  g.innerHTML = "";

  let arr = sorted ? data.filter(x=>x.created_at) : data.filter(x=>!x.created_at);

  let currentYear = "";
  arr.forEach(item=>{
    let year = item.created_at ? new Date(item.created_at).getFullYear() : "???";

    if(year !== currentYear){
      currentYear = year;
      const y = document.createElement("div");
      y.className = "year";
      y.textContent = year;
      g.appendChild(y);
    }

    const div = document.createElement("div");
    div.className = "item";

    if(item.type === "photo"){
      const img = document.createElement("img");
      img.src = item.file_path;
      div.appendChild(img);
    } else {
      const v = document.createElement("video");
      v.src = item.file_path;
      v.muted = true;
      v.loop = true;
      v.autoplay = true;
      div.appendChild(v);
    }

    div.onclick = ()=>openFS(item);
    g.appendChild(div);
  });
}

// Fullscreen
function openFS(item){
  const fs = document.getElementById("fs");
  const c = document.getElementById("fsContent");
  const d = document.getElementById("fsDate");

  c.innerHTML = "";
  d.textContent = item.created_at ? new Date(item.created_at).toLocaleString() : "";

  if(item.type === "photo"){
    const img = document.createElement("img");
    img.src = item.file_path;
    c.appendChild(img);
  } else {
    const v = document.createElement("video");
    v.src = item.file_path;
    v.controls = true;
    v.autoplay = true;
    c.appendChild(v);
  }

  fs.style.display = "flex";
}

document.getElementById("fs").onclick = ()=>(
  document.getElementById("fs").style.display = "none"
);

document.getElementById("btnSorted").onclick = ()=>{ sorted=true; render(); };
document.getElementById("btnUnsorted").onclick = ()=>{ sorted=false; render(); };
</script>
</body>
</html>
