<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Gallery</title>
<style>
:root{
  --bg:#1c1c1c;
  --panel:#0f1720;
  --accent:#60a5fa;
  --muted:#9aa4b2;
}
body{
  margin:0;
  background:var(--bg);
  color:#fff;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  -webkit-tap-highlight-color:transparent;
}
header{
  display:flex;
  justify-content:flex-start;
  gap:18px;
  padding:10px;
  font-size:17px;
}
header div{ cursor:pointer; user-select:none; padding:6px 8px; border-radius:8px; }
header div.active{ background:#111; }

#gallery{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px;
  padding:6px;
}

.year{
  grid-column:1/-1;
  text-align:left;
  padding:6px 4px;
  font-size:18px;
  font-weight:700;
  color:#fff;
}

.item{
  border:2px solid rgba(255,255,255,0.06);
  height:120px;
  border-radius:8px;
  cursor:pointer;
  background:#131313;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}
.item .placeholder{
  width:40%;
  height:40%;
  opacity:0.12;
}

.item img, .item video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/* Fullscreen viewer */
#fs{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.96);
  z-index:1200;
  justify-content:center;
  align-items:flex-start;
  flex-direction:column;
  padding-top:28px;
  box-sizing:border-box;
}
#fs .media-wrap{
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
}
#fs img, #fs video{
  width: calc(100vw - 24px);
  height: auto;
  max-height: calc(100vh - 160px);
  border-radius:8px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
}

/* bottom panel with actions */
#fsPanel{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  display:flex;
  justify-content:center;
  padding:18px;
  box-sizing:border-box;
  transform: translateY(110%);
  transition: transform 320ms cubic-bezier(.2,.9,.3,1);
  z-index:1250;
}
#fs.showPanel #fsPanel{ transform: translateY(0); }

.panelBtn{
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:10px 14px;
  background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
  color:#fff;
  border:none;
  border-radius:12px;
  font-weight:600;
  cursor:pointer;
  margin:0 8px;
  min-width:140px;
  justify-content:center;
}
.panelBtn svg{ width:18px; height:18px; flex:0 0 18px; }

/* Run workflow button at bottom of page (separate) */
#runWrap{ display:flex; justify-content:center; padding:12px; }
#runBtn{
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:10px 16px;
  border-radius:12px;
  border:none;
  background:var(--accent);
  color:#07243b;
  font-weight:700;
  cursor:pointer;
}
#runIcon{ width:18px; height:18px; display:inline-block; }

/* spinner */
@keyframes spin { to { transform: rotate(360deg); } }
.icon-spinner{ animation: spin 1s linear infinite; }

/* small helpers */
.hidden{ display:none !important; }
.center{ display:flex; align-items:center; justify-content:center; }
</style>
</head>
<body>

<header>
  <div id="btnSorted" class="active">Сортированное</div>
  <div id="btnUnsorted">Несортированное</div>
</header>

<div id="gallery"></div>

<!-- fullscreen viewer -->
<div id="fs" onclick="fsClose(event)">
  <div class="media-wrap" id="fsMediaWrap"></div>
  <div id="fsDate" style="color:#ddd; text-align:center; margin-top:12px;"></div>

  <!-- panel (appears from bottom) -->
  <div id="fsPanel">
    <button class="panelBtn" id="downloadBtn" title="Скачать">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="7 10 12 15 17 10" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="12" y1="15" x2="12" y2="3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Скачать
    </button>

    <button class="panelBtn" id="deleteBtn" title="Удалить из галереи">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="3 6 5 6 21 6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 11v6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 11v6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Удалить
    </button>
  </div>
</div>

<!-- run workflow -->
<div id="runWrap">
  <button id="runBtn" title="Запустить workflow">
    <span id="runIcon"><svg id="runSvg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="5 3 19 12 5 21 5 3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <span id="runText">Запустить workflow</span>
  </button>
</div>

<script>
const BOT_TOKEN = ""; // optional

let data = [];
let sorted = true;
const filePathCache = {};
const deletedIdsKey = "outphotos_deleted_ids";
let deletedIds = new Set(JSON.parse(localStorage.getItem(deletedIdsKey) || "[]"));

async function loadRecords(){
  try{
    const r = await fetch("records.json");
    if(!r.ok) return;
    data = await r.json();
    render();
  }catch(e){ console.error(e); }
}

async function getTelegramFilePath(file_id){
  if(filePathCache[file_id] !== undefined) return filePathCache[file_id];
  if(!BOT_TOKEN) { filePathCache[file_id] = null; return null; }
  try{
    const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getFile?file_id=${encodeURIComponent(file_id)}`);
    const j = await res.json();
    if(j.ok && j.result && j.result.file_path){
      filePathCache[file_id] = j.result.file_path;
      return j.result.file_path;
    } else {
      filePathCache[file_id] = null;
      return null;
    }
  }catch(e){
    filePathCache[file_id] = null;
    return null;
  }
}

async function render(){
  const g = document.getElementById("gallery");
  g.innerHTML = "";
  const arr = sorted ? data.filter(x=>x.created_at) : data.filter(x=>!x.created_at);
  let currentYear = "";
  for(const item of arr){
    if(deletedIds.has(item.src_msg_id)) continue;
    const year = item.created_at ? new Date(item.created_at).getFullYear() : "???";
    if(year !== currentYear){
      currentYear = year;
      const y = document.createElement("div");
      y.className = "year";
      y.textContent = year;
      g.appendChild(y);
    }

    const div = document.createElement("div");
    div.className = "item";
    const placeholder = document.createElement("div");
    placeholder.className = "placeholder";
    placeholder.innerHTML = `<svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="2" ry="2" stroke-width="1.4"/><path d="M8 14l2.5-3 2 2.5L16 10l3 4H8z" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
    div.appendChild(placeholder);

    (async ()=>{
      const fp = await getTelegramFilePath(item.src_file_id);
      if(!fp){ div.remove(); return; }
      const url = `https://api.telegram.org/file/bot${BOT_TOKEN}/${fp}`;
      div.innerHTML = "";
      if(item.type === "photo"){
        const img = document.createElement("img");
        img.src = url;
        div.appendChild(img);
      } else if(item.type === "video"){
        const img = document.createElement("img");
        img.src = url + ".jpg";
        img.onerror = ()=>{ img.src = url; };
        div.appendChild(img);
      } else {
        div.innerHTML = "<div style='padding:8px;color:var(--muted)'>Unsupported</div>";
      }
    })();

    div.onclick = ()=>openFS(item);
    g.appendChild(div);
  }
}

async function openFS(item){
  const fs = document.getElementById("fs");
  const wrap = document.getElementById("fsMediaWrap");
  const dateEl = document.getElementById("fsDate");
  wrap.innerHTML = "";
  dateEl.textContent = item.created_at ? new Date(item.created_at).toLocaleString() : "";
  fs.style.display = "flex";
  requestAnimationFrame(()=> fs.classList.add("showPanel"));

  const fp = await getTelegramFilePath(item.src_file_id);
  if(!fp){ setTimeout(closeViewerImmediate,300); return; }
  const url = `https://api.telegram.org/file/bot${BOT_TOKEN}/${fp}`;

  if(item.type==="photo"){
    const img=document.createElement("img");
    img.src=url;
    wrap.appendChild(img);
    setupDownloadButton(url,item);
    setupDeleteButton(item);
  } else if(item.type==="video"){
    const v=document.createElement("video");
    v.src=url; v.controls=true; v.autoplay=true;
    v.style.maxHeight="calc(100vh - 160px)";
    wrap.appendChild(v);
    setupDownloadButton(url,item);
    setupDeleteButton(item);
  } else wrap.innerHTML="<div style='color:var(--muted)'>Неподдерживаемый тип</div>";
}

function closeViewerImmediate(){
  const fs = document.getElementById("fs");
  fs.classList.remove("showPanel");
  fs.style.display = "none";
  document.getElementById("fsMediaWrap").innerHTML="";
}

function fsClose(e){
  const panel=document.getElementById("fsPanel");
  const mediaWrap=document.getElementById("fsMediaWrap");
  if(panel.contains(e.target) || mediaWrap.contains(e.target)) return;
  closeViewerImmediate();
}

function setupDownloadButton(fileUrl,item){
  const btn=document.getElementById("downloadBtn");
  btn.onclick=async e=>{
    e.stopPropagation();
    try{
      const res=await fetch(fileUrl);
      const blob=await res.blob();
      const ext=item.type==="photo"?".jpg":".mp4";
      const name=`outphoto_${item.src_msg_id}${ext}`;
      const urlObj=URL.createObjectURL(blob);
      const a=document.createElement("a"); a.href=urlObj; a.download=name; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(urlObj);
    }catch(err){ console.error(err); alert("Не удалось скачать файл"); }
  };
}

function setupDeleteButton(item){
  const btn=document.getElementById("deleteBtn");
  btn.onclick=e=>{
    e.stopPropagation();
    deletedIds.add(item.src_msg_id);
    localStorage.setItem(deletedIdsKey,JSON.stringify([...deletedIds]));
    render();
    closeViewerImmediate();
  };
}

document.getElementById("btnSorted").onclick=()=>{
  sorted=true;
  document.getElementById("btnSorted").classList.add("active");
  document.getElementById("btnUnsorted").classList.remove("active");
  render();
};
document.getElementById("btnUnsorted").onclick=()=>{
  sorted=false;
  document.getElementById("btnUnsorted").classList.add("active");
  document.getElementById("btnSorted").classList.remove("active");
  render();
};

// workflow trigger
const runBtn=document.getElementById("runBtn");
const runIconWrap=document.getElementById("runIcon");
const runText=document.getElementById("runText");

async function runWorkflow(){
  // dispatcher uses repository_dispatch without exposing token
  runIconWrap.innerHTML=`<svg class="icon-spinner" viewBox="0 0 50 50"><circle cx="25" cy="25" r="20" stroke="white" stroke-width="4" stroke-linecap="round" fill="none" stroke-dasharray="31.4 31.4"/></svg>`;
  runBtn.disabled=true;
  runText.textContent="Запущен...";

  try{
    const resp = await fetch("/.netlify/functions/dispatch-workflow", { method:"POST" });
    if(!resp.ok) throw new Error(resp.statusText);
    runIconWrap.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 6L9 17l-5-5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    runText.textContent="Готово";
  }catch(err){
    console.error(err);
    runIconWrap.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 6L6 18M6 6l12 12" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    runText.textContent="Ошибка";
  }finally{
    setTimeout(()=>{
      runIconWrap.innerHTML=`<svg id="runSvg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="5 3 19 12 5 21 5 3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      runText.textContent="Запустить workflow";
      runBtn.disabled=false;
      loadRecords();
    },3000);
  }
}

runBtn.onclick=runWorkflow;

// initial
loadRecords();
</script>
</body>
</html>
