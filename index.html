<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Gallery</title>
<style>
  body {
    margin:0;
    background:#0f1720;
    color:white;
    font-family:sans-serif;
  }

  header {
    display:flex;
    justify-content:flex-start;
    gap:25px;
    padding:10px;
    font-size:18px;
  }
  header div { cursor:pointer; }

  #gallery {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    padding:6px;
  }

  .year {
    grid-column:1/-1;
    text-align:left;
    padding:5px;
    font-size:16px;
    font-weight:bold;
  }

  .item {
    border:2px solid #ffffff33;
    height:120px;
    overflow:hidden;
    border-radius:6px;
    cursor:pointer;
    background:#1a2530;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .item img,
  .item video {
    width:100%;
    height:100%;
    object-fit:cover;
  }

  #fs {
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.95);
    z-index:2000;
    justify-content:center;
    align-items:center;
    flex-direction:column;
  }
  #fs img, #fs video {
    max-width:100%;
    max-height:80%;
  }
  #fs .date {
    margin-top:12px;
    font-size:18px;
  }
</style>
</head>
<body>

<!-- Панель альбомов -->
<header id="albumsPanel">
  <!-- Кнопки альбомов будут генерироваться автоматически -->
</header>

<div id="gallery"></div>

<div id="fs">
  <div id="fsContent"></div>
  <div class="date" id="fsDate"></div>
</div>

<script>
const BOT_TOKEN = "<ВАШ_BOT_TOKEN>"; // вставь сюда токен, можно позже убрать
let data = [];
let currentAlbum = "Все";

// Загружаем JSON с датами
fetch("records.json")
  .then(r=>r.json())
  .then(j=>{
    data=j;
    buildAlbumsPanel();
    render();
  });

// Генерация панели альбомов
function buildAlbumsPanel() {
  const panel = document.getElementById("albumsPanel");
  panel.innerHTML = "";

  const albumsSet = new Set(data.map(x => x.album || "Все"));
  albumsSet.add("Все"); // гарантируем вкладку "Все"

  albumsSet.forEach(name=>{
    const btn = document.createElement("div");
    btn.textContent = name;
    btn.style.cursor = "pointer";
    btn.style.padding = "6px 15px";

    btn.onclick = ()=>{
      currentAlbum = name;
      render();
    };

    panel.appendChild(btn);
  });
}

// Рендер галереи
function render() {
  const g = document.getElementById("gallery");
  g.innerHTML = "";

  const arr = data.filter(item=>{
    if(currentAlbum === "Все") return true;
    return item.album === currentAlbum;
  });

  let currentYear = "";

  arr.forEach(item=>{
    const year = item.created_at ? new Date(item.created_at).getFullYear() : "???";

    if(year !== currentYear){
      currentYear = year;
      const y = document.createElement("div");
      y.className = "year";
      y.textContent = year;
      g.appendChild(y);
    }

    const div = document.createElement("div");
    div.className = "item";

    if(item.type === "photo") {
      const img = document.createElement("img");
      img.src = `https://api.telegram.org/file/bot${BOT_TOKEN}/${item.src_file_id}`;
      div.appendChild(img);
    } else if(item.type === "video") {
      const v = document.createElement("video");
      v.muted = true;
      v.loop = true;
      v.autoplay = true;
      v.src = `https://api.telegram.org/file/bot${BOT_TOKEN}/${item.src_file_id}`;
      div.appendChild(v);
    }

    div.onclick = ()=>openFS(item);
    g.appendChild(div);
  });
}

// Fullscreen открытие
function openFS(item){
  const fs = document.getElementById("fs");
  const c = document.getElementById("fsContent");
  const d = document.getElementById("fsDate");

  c.innerHTML = "";
  d.textContent = item.created_at ? new Date(item.created_at).toLocaleString() : "";

  if(item.type === "photo"){
    const img = document.createElement("img");
    img.src = `https://api.telegram.org/file/bot${BOT_TOKEN}/${item.src_file_id}`;
    c.appendChild(img);
  } else if(item.type === "video"){
    const v = document.createElement("video");
    v.controls = true;
    v.autoplay = true;
    v.src = `https://api.telegram.org/file/bot${BOT_TOKEN}/${item.src_file_id}`;
    c.appendChild(v);
  }

  fs.style.display = "flex";
}

document.getElementById("fs").onclick = ()=>(
  document.getElementById("fs").style.display="none"
);
</script>

</body>
</html>
