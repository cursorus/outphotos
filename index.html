<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Outphotos</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
    body {
        background: #0d0d0f;
        margin: 0;
        font-family: sans-serif;
        color: white;
    }

    h2.year {
        margin: 20px 0 10px;
        padding-left: 10px;
        font-size: 20px;
        opacity: 0.9;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        padding: 6px;
    }

    .item {
        width: 100%;
        aspect-ratio: 1/1;
        background: #181818;
        border-radius: 6px;
        overflow: hidden;
        position: relative;
    }

    .item-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    /* FULLSCREEN VIEWER */
    #viewer {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.95);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 999;
        flex-direction: column;
    }

    #viewer img, 
    #viewer video {
        max-width: 100%;
        max-height: 85%;
        border-radius: 8px;
    }

    #viewer .date {
        margin-top: 10px;
        font-size: 16px;
        opacity: 0.8;
    }

</style>
</head>
<body>

<div id="content"></div>

<div id="viewer" onclick="closeViewer()">
    <div id="viewerMedia"></div>
    <div class="date" id="viewerDate"></div>
</div>

<script>
// records.json будет подгружаться автоматически с GitHub Pages
fetch("records.json")
    .then(r => r.json())
    .then(records => render(records));

function render(records) {
    const content = document.getElementById("content");

    // группировка по году
    const groups = {};
    for (const r of records) {
        const year = (r.created_at || "").slice(0, 4);
        if (!groups[year]) groups[year] = [];
        groups[year].push(r);
    }

    // рисуем по годам
    for (const year of Object.keys(groups).sort().reverse()) {
        const h = document.createElement("h2");
        h.className = "year";
        h.textContent = year;
        content.appendChild(h);

        const grid = document.createElement("div");
        grid.className = "grid";

        for (const rec of groups[year]) {
            const item = document.createElement("div");
            item.className = "item";

            if (rec.type === "photo") {
                const img = document.createElement("img");
                img.src = rec.local_path;        // <-- ИСПОЛЬЗУЕМ ЛОКАЛЬНЫЙ ФАЙЛ
                img.className = "item-img";
                img.onclick = () => openViewer(img.src, rec.created_at, false);
                item.appendChild(img);
            } 
            else if (rec.type === "video") {
                const video = document.createElement("video");
                video.src = rec.local_path;
                video.className = "item-img";
                video.muted = true;
                video.loop = true;
                video.play();
                video.onclick = () => openViewer(video.src, rec.created_at, true);
                item.appendChild(video);
            }

            grid.appendChild(item);
        }

        content.appendChild(grid);
    }
}

function openViewer(src, date, isVideo) {
    const viewer = document.getElementById("viewer");
    const media = document.getElementById("viewerMedia");
    const d = document.getElementById("viewerDate");

    media.innerHTML = "";

    if (isVideo) {
        const v = document.createElement("video");
        v.src = src;
        v.controls = true;
        v.autoplay = true;
        media.appendChild(v);
    } else {
        const i = document.createElement("img");
        i.src = src;
        media.appendChild(i);
    }

    d.textContent = date.replace("T", " ").replace("Z", "");
    viewer.style.display = "flex";
}

function closeViewer() {
    const viewer = document.getElementById("viewer");
    const media = document.getElementById("viewerMedia");
    viewer.style.display = "none";
    media.innerHTML = "";
}
</script>

</body>
</html>
