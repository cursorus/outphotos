<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Gallery</title>
<style>
:root{
  --bg:#1c1c1c;
  --panel:#0f1720;
  --accent:#60a5fa;
  --muted:#9aa4b2;
}
body{
  margin:0;
  background:var(--bg);
  color:#fff;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  -webkit-tap-highlight-color:transparent;
}
header{
  display:flex;
  justify-content:flex-start;
  gap:18px;
  padding:10px;
  font-size:17px;
}
header div{ cursor:pointer; user-select:none; padding:6px 8px; border-radius:8px; }
header div.active{ background:#111; }

#gallery{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px;
  padding:6px;
}

.year{
  grid-column:1/-1;
  text-align:left;
  padding:6px 4px;
  font-size:18px;
  font-weight:700;
  color:#fff;
}

.item{
  border:2px solid rgba(255,255,255,0.06);
  height:120px;
  border-radius:8px;
  cursor:pointer;
  background:#131313;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}
.item .placeholder{
  width:40%;
  height:40%;
  opacity:0.12;
}
.item img, .item video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/* ---------------------------- */
/* FULLSCREEN VIEWER */
/* ---------------------------- */
#fs{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.96);
  z-index:1200;
  justify-content:center;
  align-items:flex-start;
  flex-direction:column;
  padding-top:28px;
  box-sizing:border-box;
}

#fs .media-wrap{
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
}

#fs img, #fs video{
  width: calc(100vw - 24px);
  height: auto;
  max-height: calc(100vh - 160px);
  border-radius:8px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
}

/* bottom panel with actions */
#fsPanel{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  display:flex;
  justify-content:center;
  padding:18px;
  box-sizing:border-box;
  transform: translateY(110%);
  transition: transform 320ms cubic-bezier(.2,.9,.3,1);
  z-index:1250;
}
#fs.showPanel #fsPanel{ transform: translateY(0); }

.panelBtn{
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:10px 14px;
  background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
  color:#fff;
  border:none;
  border-radius:12px;
  font-weight:600;
  cursor:pointer;
  margin:0 8px;
  min-width:140px;
  justify-content:center;
}
.panelBtn svg{ width:18px; height:18px; flex:0 0 18px; }

/* ---------------------------- */
/* RUN WORKFLOW BUTTON */
/* ---------------------------- */
#runWrap{ display:flex; justify-content:center; padding:12px; }
#runBtn{
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:10px 16px;
  border-radius:12px;
  border:none;
  background:var(--accent);
  color:#07243b;
  font-weight:700;
  cursor:pointer;
}
#runIcon{ width:18px; height:18px; display:inline-block; }

/* spinner */
@keyframes spin { to { transform: rotate(360deg); } }
.icon-spinner{ animation: spin 1s linear infinite; }

/* ---------------------------- */
/* CUSTOM CONSOLE */
/* ---------------------------- */
#consoleBtn{
  position:fixed;
  bottom:80px;
  right:12px;
  z-index:1500;
  background:#222;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  border:1px solid #333;
}
#consoleBtn svg{
  width:22px;
  height:22px;
  stroke:#fff;
}

#consolePanel{
  display:none;
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:35%;
  background:#000;
  color:#0f0;
  font-family:monospace;
  padding:10px;
  overflow-y:auto;
  z-index:1400;
  border-top:2px solid #444;
  white-space:pre-wrap;
  font-size:13px;
}
</style>
</head>
<body>

<header>
  <div id="btnSorted" class="active">Сортированное</div>
  <div id="btnUnsorted">Несортированное</div>
</header>

<div id="gallery"></div>

<!-- FULLSCREEN VIEWER -->
<div id="fs" onclick="fsClose(event)">
  <div class="media-wrap" id="fsMediaWrap"></div>
  <div id="fsDate" style="color:#ddd; text-align:center; margin-top:12px;"></div>

  <div id="fsPanel">
    <button class="panelBtn" id="downloadBtn">
      Скачать
    </button>
    <button class="panelBtn" id="deleteBtn">
      Удалить
    </button>
  </div>
</div>

<!-- RUN WORKFLOW -->
<div id="runWrap">
  <button id="runBtn">
    <span id="runIcon">▶</span>
    <span id="runText">Запустить workflow</span>
  </button>
</div>

<!-- TOGGLE CONSOLE BUTTON -->
<div id="consoleBtn" onclick="toggleConsole()">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 17l6-6-6-6"/><path d="M12 19h8"/></svg>
</div>

<!-- CONSOLE PANEL -->
<div id="consolePanel"></div>

<script>
/* ================================================================== */
/* CUSTOM CONSOLE LOGGER */
/* ================================================================== */
(function() {
  const panel = document.getElementById("consolePanel");

  function push(type, msg) {
    const t = typeof msg === "object" ? JSON.stringify(msg, null, 2) : msg;
    panel.textContent += `[${type}] ${t}\n`;
    panel.scrollTop = panel.scrollHeight;
  }

  const oldLog = console.log;
  console.log = function(...a){
    push("LOG", a.join(" "));
    oldLog.apply(console, a);
  };

  const oldErr = console.error;
  console.error = function(...a){
    push("ERROR", a.join(" "));
    oldErr.apply(console, a);
  };

  const oldWarn = console.warn;
  console.warn = function(...a){
    push("WARN", a.join(" "));
    oldWarn.apply(console, a);
  };

  window.toggleConsole = function(){
    panel.style.display = panel.style.display === "none" ? "block" : "none";
  };
})();
console.log("Панель консоли загружена");

/* ================================================================== */
/* YOUR ORIGINAL SCRIPT (ПОЧТИ БЕЗ ИЗМЕНЕНИЙ) */
/* ================================================================== */

const BOT_TOKEN="";

let data=[];
let sorted=true;
const filePathCache={};
const deletedIdsKey="outphotos_deleted_ids";
let deletedIds=new Set(JSON.parse(localStorage.getItem(deletedIdsKey)||"[]"));

async function loadRecords(){
  console.log("Загрузка records.json...");
  try{
    const r=await fetch("records.json?cache="+Math.random());
    console.log("Статус ответа:", r.status);
    if(!r.ok){
      console.error("Файл records.json не загрузился");
      return;
    }
    data=await r.json();
    console.log("Загружено:", data);
    render();
  }catch(e){
    console.error("Ошибка загрузки:", e);
  }
}

async function getTelegramFilePath(file_id){
  if(filePathCache[file_id]!==undefined) return filePathCache[file_id];
  if(!BOT_TOKEN){ filePathCache[file_id]=null; return null; }
  return null;
}

async function render(){
  console.log("Рендер галереи…");
  const g=document.getElementById("gallery");
  g.innerHTML="";

  const arr=sorted ? data.filter(x=>x.created_at) : data.filter(x=>!x.created_at);

  console.log("Элементов в списке:", arr.length);

  let currentYear="";
  for(const item of arr){
    if(deletedIds.has(item.src_msg_id)) continue;
    const year=item.created_at ? new Date(item.created_at).getFullYear() : "???";

    if(year!==currentYear){
      currentYear=year;
      const y=document.createElement("div");
      y.className="year";
      y.textContent=year;
      g.appendChild(y);
    }

    const div=document.createElement("div");
    div.className="item";
    div.textContent="Загрузка…";
    g.appendChild(div);
  }
}

document.getElementById("btnSorted").onclick=()=>{
  sorted=true;
  render();
};
document.getElementById("btnUnsorted").onclick=()=>{
  sorted=false;
  render();
};

loadRecords();
</script>
</body>
</html>
