<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery</title>
<style>
  body {
    margin: 0;
    font-family: sans-serif;
    background-color: #0f1720;
    color: #fff;
  }
  header {
    display: flex;
    justify-content: flex-start;
    padding: 10px;
    gap: 20px;
  }
  header div {
    cursor: pointer;
    font-weight: bold;
  }
  #gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2px;
    padding: 2px;
  }
  .item {
    position: relative;
    cursor: pointer;
    overflow: hidden;
    height: 120px;
  }
  .item img, .item video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  #fullscreenOverlay {
    display: none;
    position: fixed;
    top:0; left:0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.95);
    justify-content: center;
    align-items: center;
    z-index: 1000;
    flex-direction: column;
  }
  #fullscreenOverlay img, #fullscreenOverlay video {
    max-width: 100%;
    max-height: 80%;
  }
  #fullscreenOverlay .date {
    margin-top: 10px;
    font-size: 18px;
    color: #fff;
  }
  .year-label {
    width: 100%;
    text-align: left;
    font-size: 16px;
    font-weight: bold;
    padding: 5px 0 0 5px;
  }
</style>
</head>
<body>
<header>
  <div id="sortedBtn">Сортированное</div>
  <div id="unsortedBtn">Несортированное</div>
</header>

<div id="gallery"></div>

<div id="fullscreenOverlay">
  <div id="fsContent"></div>
  <div class="date" id="fsDate"></div>
</div>

<script>
// Если хотите, вставьте сюда свой BOT_TOKEN
const BOT_TOKEN = ''; // пустой если используете file_path из records.json

let records = [];
let sorted = true;

// загрузка JSON
fetch('records.json')
  .then(r => r.json())
  .then(data => {
    records = data;
    showGallery();
  });

function showGallery() {
  const gallery = document.getElementById('gallery');
  gallery.innerHTML = '';

  let displayData = sorted 
    ? records.filter(r => r.created_at) 
    : records.filter(r => !r.created_at);

  let currentYear = '';
  displayData.forEach(item => {
    const year = item.created_at ? new Date(item.created_at).getFullYear() : '??';
    if (year !== currentYear) {
      currentYear = year;
      const yearDiv = document.createElement('div');
      yearDiv.className = 'year-label';
      yearDiv.textContent = year;
      gallery.appendChild(yearDiv);
    }

    const div = document.createElement('div');
    div.className = 'item';
    if(item.type==='photo'){
      const img = document.createElement('img');
      img.src = item.file_path.startsWith('http') 
                ? item.file_path 
                : `https://api.telegram.org/file/bot${BOT_TOKEN}/${item.file_path}`;
      div.appendChild(img);
    } else if(item.type==='video'){
      const vid = document.createElement('video');
      vid.src = item.file_path.startsWith('http') 
                ? item.file_path 
                : `https://api.telegram.org/file/bot${BOT_TOKEN}/${item.file_path}`;
      vid.muted = true;
      vid.loop = true;
      vid.autoplay = true;
      div.appendChild(vid);
    }

    div.onclick = () => showFullscreen(item);
    gallery.appendChild(div);
  });
}

function showFullscreen(item){
  const overlay = document.getElementById('fullscreenOverlay');
  const fsContent = document.getElementById('fsContent');
  const fsDate = document.getElementById('fsDate');

  fsContent.innerHTML = '';
  if(item.type==='photo'){
    const img = document.createElement('img');
    img.src = item.file_path.startsWith('http') 
              ? item.file_path 
              : `https://api.telegram.org/file/bot${BOT_TOKEN}/${item.file_path}`;
    fsContent.appendChild(img);
  } else if(item.type==='video'){
    const vid = document.createElement('video');
    vid.src = item.file_path.startsWith('http') 
              ? item.file_path 
              : `https://api.telegram.org/file/bot${BOT_TOKEN}/${item.file_path}`;
    vid.controls = true;
    vid.autoplay = true;
    fsContent.appendChild(vid);
  }

  fsDate.textContent = item.created_at ? new Date(item.created_at).toLocaleString() : '';
  overlay.style.display = 'flex';
}

document.getElementById('fullscreenOverlay').onclick = () => {
  document.getElementById('fullscreenOverlay').style.display = 'none';
}

document.getElementById('sortedBtn').onclick = () => { sorted=true; showGallery(); }
document.getElementById('unsortedBtn').onclick = () => { sorted=false; showGallery(); }
</script>
</body>
</html>
